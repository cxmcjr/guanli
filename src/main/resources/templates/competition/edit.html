<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑竞赛成果</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "微软雅黑", sans-serif; background: #f0f2f5; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; padding: 20px 40px; }
        .header h1 { font-size: 24px; }
        .nav { background: white; padding: 0 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; }
        .nav a { display: block; padding: 15px 20px; text-decoration: none; color: #333; font-size: 14px; border-bottom: 3px solid transparent; }
        .nav a:hover, .nav a.active { color: #1a73e8; border-bottom-color: #1a73e8; }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .form-card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .form-card h2 { margin-bottom: 25px; color: #333; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 12px 30px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
        .btn-primary { background: #1a73e8; color: white; width: 100%; }
        .btn-back { background: #eee; color: #333; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="header"><h1>学科竞赛成果管理</h1></div>
<div class="nav">
    <a href="/">首页</a>
    <a href="/competition" class="active">学科竞赛</a>
    <a href="/innovation">大创项目</a>
    <a href="/software">软件著作权</a>
    <a href="/paper">学术论文</a>
    <a href="/file">文件管理</a>
    <a href="/statistics">数据统计</a>
</div>
<div class="container">
    <a href="/competition" class="btn-back">← 返回列表</a>
    <div class="form-card">
        <h2>编辑竞赛成果</h2>
        <form action="/competition/edit" method="post">
            <input type="hidden" name="id" th:value="${c.id}">
            <div class="form-row">
                <div class="form-group">
                    <label>竞赛类别 *</label>
                    <select name="category" required>
                        <option value="A" th:selected="${c.category == 'A'}">A类</option>
                        <option value="B" th:selected="${c.category == 'B'}">B类</option>
                        <option value="C" th:selected="${c.category == 'C'}">C类</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>竞赛名称 *</label>
                    <input type="text" name="name" th:value="${c.name}" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>获奖级别 *</label>
                    <select name="awardLevel" required>
                        <option value="国家级" th:selected="${c.awardLevel == '国家级'}">国家级</option>
                        <option value="省级" th:selected="${c.awardLevel == '省级'}">省级</option>
                        <option value="市级" th:selected="${c.awardLevel == '市级'}">市级</option>
                        <option value="校级" th:selected="${c.awardLevel == '校级'}">校级</option>
                        <option value="院级" th:selected="${c.awardLevel == '院级'}">院级</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>获奖等级 *</label>
                    <select name="awardGrade" required>
                        <option value="一等奖" th:selected="${c.awardGrade == '一等奖'}">一等奖</option>
                        <option value="二等奖" th:selected="${c.awardGrade == '二等奖'}">二等奖</option>
                        <option value="三等奖" th:selected="${c.awardGrade == '三等奖'}">三等奖</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>获奖单位</label><input type="text" name="awardUnit" th:value="${c.awardUnit}"></div>
                <div class="form-group"><label>主办单位</label><input type="text" name="hostUnit" th:value="${c.hostUnit}"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>承办单位</label><input type="text" name="organizer" th:value="${c.organizer}"></div>
                <div class="form-group"><label>获奖时间</label><input type="date" name="awardDate" th:value="${c.awardDate}"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>指导教师</label><input type="text" name="teacher" th:value="${c.teacher}"></div>
                <div class="form-group"><label>提交人</label><input type="text" name="submitter" th:value="${c.submitter}"></div>
            </div>
            <div class="form-group"><label>参赛选手</label><textarea name="participants" th:text="${c.participants}"></textarea></div>
            <button type="submit" class="btn btn-primary">保存修改</button>
        </form>
    </div>
</div>
</body>
</html>
