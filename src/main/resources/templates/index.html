<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生管理系统</title>
    <style>
        body { margin: 40px; font-family: "微软雅黑"; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background: #f5f5f5; }
        .btn { padding: 6px 12px; background: #409eff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-danger { background: #f56c6c; }
    </style>
</head>
<body>
<h2>学生管理系统</h2>
<a href="/add"><button class="btn">添加学生</button></a>
<table>
    <tr>
        <th>学号</th><th>姓名</th><th>性别</th><th>年龄</th><th>专业</th><th>电话</th><th>操作</th>
    </tr>
    <tr th:each="s : ${students}">
        <td th:text="${s.stuId}"></td>
        <td th:text="${s.name}"></td>
        <td th:text="${s.gender}"></td>
        <td th:text="${s.age}"></td>
        <td th:text="${s.major}"></td>
        <td th:text="${s.phone}"></td>
        <td>
            <a th:href="@{/edit/{id}(id=${s.stuId})}"><button class="btn">修改</button></a>
            <a th:href="@{/delete/{id}(id=${s.stuId})}" onclick="return confirm('确定删除？')">
                <button class="btn btn-danger">删除</button>
            </a>
        </td>
    </tr>
</table>
</body>
</html>
