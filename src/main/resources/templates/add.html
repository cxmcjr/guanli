<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>添加学生</title>
</head>
<body>
<h3>添加学生</h3>
<form action="/add" method="post">
    学号：<input name="stuId" required><br><br>
    姓名：<input name="name" required><br><br>
    性别：<input name="gender"><br><br>
    年龄：<input name="age" type="number"><br><br>
    专业：<input name="major"><br><br>
    电话：<input name="phone"><br><br>
    <button type="submit">保存</button>
</form>
</body>
</html>
