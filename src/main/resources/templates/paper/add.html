<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>录入学术论文</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "微软雅黑", sans-serif; background: #f0f2f5; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; padding: 20px 40px; }
        .header h1 { font-size: 24px; }
        .nav { background: white; padding: 0 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; }
        .nav a { display: block; padding: 15px 20px; text-decoration: none; color: #333; font-size: 14px; border-bottom: 3px solid transparent; }
        .nav a:hover, .nav a.active { color: #1a73e8; border-bottom-color: #1a73e8; }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .form-card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .form-card h2 { margin-bottom: 25px; color: #333; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 12px 30px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
        .btn-primary { background: #1a73e8; color: white; width: 100%; }
        .btn-back { background: #eee; color: #333; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="header"><h1>学术论文管理</h1></div>
<div class="nav">
    <a href="/">首页</a>
    <a href="/competition">学科竞赛</a>
    <a href="/innovation">大创项目</a>
    <a href="/software">软件著作权</a>
    <a href="/paper" class="active">学术论文</a>
    <a href="/file">文件管理</a>
    <a href="/statistics">数据统计</a>
</div>
<div class="container">
    <a href="/paper" class="btn-back">← 返回列表</a>
    <div class="form-card">
        <h2>录入学术论文</h2>
        <form action="/paper/add" method="post" enctype="multipart/form-data">
            <div class="form-group"><label>论文标题 *</label><input type="text" name="title" required></div>
            <div class="form-row">
                <div class="form-group"><label>期刊名称</label><input type="text" name="journalName"></div>
                <div class="form-group">
                    <label>期刊级别</label>
                    <select name="journalLevel">
                        <option value="">请选择</option>
                        <option value="CCF A类会议">CCF A类会议</option>
                        <option value="CCF B类会议">CCF B类会议</option>
                        <option value="CCF C类会议">CCF C类会议</option>
                        <option value="EI会议">EI会议</option>
                        <option value="SCI一区">SCI一区</option>
                        <option value="SCI二区">SCI二区</option>
                        <option value="SCI三区">SCI三区</option>
                        <option value="SCI四区">SCI四区</option>
                        <option value="EI期刊">EI期刊</option>
                        <option value="北大核心期刊">北大核心期刊</option>
                        <option value="省级期刊">省级期刊</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>投稿时间</label><input type="date" name="submitTime"></div>
                <div class="form-group"><label>录用时间</label><input type="date" name="acceptTime"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>论文作者</label><input type="text" name="authors" placeholder="多个作者用逗号分隔"></div>
                <div class="form-group"><label>研究方向关键词</label><input type="text" name="keywords" placeholder="多个关键词用逗号分隔"></div>
            </div>
            <div class="form-group"><label>提交人</label><input type="text" name="submitter"></div>
            <div class="form-group"><label>上传论文材料（投稿初稿PDF、录用终稿PDF、审稿意见PDF）</label><input type="file" name="files" multiple accept=".pdf"></div>
            <button type="submit" class="btn btn-primary">提交</button>
        </form>
    </div>
</div>
</body>
</html>
