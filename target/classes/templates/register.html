<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册 - 科研成果管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "微软雅黑", sans-serif; background: linear-gradient(135deg, #1a73e8, #0d47a1); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .register-box { background: white; border-radius: 16px; padding: 40px; width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .register-box h2 { text-align: center; color: #1a73e8; margin-bottom: 10px; font-size: 24px; }
        .register-box .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus { outline: none; border-color: #1a73e8; }
        .btn { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #1557b0; }
        .links { text-align: center; margin-top: 20px; font-size: 13px; }
        .links a { color: #1a73e8; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .msg { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; text-align: center; }
        .msg-error { background: #fde8e8; color: #c62828; }
        .hint { font-size: 12px; color: #999; margin-top: 4px; }
    </style>
</head>
<body>
<div class="register-box">
    <h2>用户注册</h2>
    <p class="subtitle">注册后默认角色为学生/教师</p>
    <div th:if="${error}" class="msg msg-error" th:text="${error}"></div>
    <form action="/register" method="post">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" placeholder="至少3位字符" required minlength="3">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" placeholder="至少6位字符" required minlength="6">
        </div>
        <div class="form-group">
            <label>真实姓名</label>
            <input type="text" name="realName" placeholder="请输入真实姓名" required>
        </div>
        <button type="submit" class="btn">注 册</button>
    </form>
    <div class="links">
        已有账号？<a href="/login">立即登录</a>
    </div>
</div>
</body>
</html>
