<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>软件著作权详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "微软雅黑", sans-serif; background: #f0f2f5; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; padding: 20px 40px; }
        .header h1 { font-size: 24px; }
        .nav { background: white; padding: 0 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; }
        .nav a { display: block; padding: 15px 20px; text-decoration: none; color: #333; font-size: 14px; border-bottom: 3px solid transparent; }
        .nav a:hover, .nav a.active { color: #1a73e8; border-bottom-color: #1a73e8; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .card h3 { margin-bottom: 15px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .info-item { padding: 8px 0; }
        .info-item .label { font-size: 13px; color: #888; }
        .info-item .value { font-size: 15px; color: #333; margin-top: 3px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-success { background: #34a853; color: white; }
        .btn-back { background: #eee; color: #333; padding: 10px 20px; border-radius: 6px; font-size: 14px; display: inline-block; margin-bottom: 15px; text-decoration: none; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
        th { background: #f8f9fa; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 13px; color: #555; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .msg { padding: 10px 20px; background: #d4edda; color: #155724; border-radius: 6px; margin-bottom: 15px; }
        .status { padding: 3px 10px; border-radius: 12px; font-size: 12px; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .status-archived { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
<div class="header"><h1>软件著作权管理</h1></div>
<div class="nav">
    <a href="/">首页</a>
    <a href="/competition">学科竞赛</a>
    <a href="/innovation">大创项目</a>
    <a href="/software" class="active">软件著作权</a>
    <a href="/paper">学术论文</a>
    <a href="/file">文件管理</a>
    <a href="/statistics">数据统计</a>
</div>
<div class="container">
    <div th:if="${msg}" class="msg" th:text="${msg}"></div>
    <a href="/software" class="btn-back">← 返回列表</a>

    <div class="card">
        <h3>基本信息</h3>
        <div class="info-grid">
            <div class="info-item"><div class="label">软著名称</div><div class="value" th:text="${s.name}"></div></div>
            <div class="info-item"><div class="label">所属单位</div><div class="value" th:text="${s.unit}"></div></div>
            <div class="info-item"><div class="label">著作权人</div><div class="value" th:text="${s.author}"></div></div>
            <div class="info-item"><div class="label">登记号</div><div class="value" th:text="${s.registrationNo}"></div></div>
            <div class="info-item"><div class="label">登记日期</div><div class="value" th:text="${s.registrationDate}"></div></div>
            <div class="info-item"><div class="label">提交人</div><div class="value" th:text="${s.submitter}"></div></div>
            <div class="info-item"><div class="label">当前状态</div><div class="value"><span class="status" th:classappend="'status-' + ${s.status}" th:text="${s.status}"></span></div></div>
        </div>
    </div>

    <div class="card">
        <h3>相关文件</h3>
        <form th:action="@{/software/upload/{id}(id=${s.id})}" method="post" enctype="multipart/form-data" style="margin-bottom:15px;">
            <input type="file" name="files" multiple style="margin-bottom:8px;">
            <button type="submit" class="btn btn-primary">上传文件</button>
        </form>
        <table>
            <thead><tr><th>文件名</th><th>类型</th><th>大小</th><th>上传时间</th><th>操作</th></tr></thead>
            <tbody>
                <tr th:each="f : ${files}">
                    <td th:text="${f.originalName}"></td>
                    <td th:text="${f.fileType}"></td>
                    <td th:text="${f.fileSize} + ' B'"></td>
                    <td th:text="${f.uploadTime}"></td>
                    <td>
                        <a th:href="@{/file/preview/{id}(id=${f.id})}" target="_blank" class="btn btn-primary btn-sm">预览</a>
                        <a th:href="@{/file/download/{id}(id=${f.id})}" class="btn btn-success btn-sm">下载</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h3>审核记录</h3>
        <table>
            <thead><tr><th>审核人</th><th>审核级别</th><th>结果</th><th>意见</th><th>时间</th></tr></thead>
            <tbody>
                <tr th:each="r : ${reviews}">
                    <td th:text="${r.reviewer}"></td>
                    <td th:text="${r.reviewLevel}"></td>
                    <td><span class="status" th:classappend="'status-' + ${r.status}" th:text="${r.status}"></span></td>
                    <td th:text="${r.opinion}"></td>
                    <td th:text="${r.reviewTime}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h3>审核操作</h3>
        <form th:action="@{/software/review/{id}(id=${s.id})}" method="post">
            <div class="form-row">
                <div class="form-group"><label>审核人</label><input type="text" name="reviewer" required></div>
                <div class="form-group">
                    <label>审核级别</label>
                    <select name="reviewLevel" required>
                        <option value="secretary">科研秘书</option>
                        <option value="leader">学院领导</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>审核结果</label>
                    <select name="status" required>
                        <option value="secretary_approved">科研秘书-通过</option>
                        <option value="leader_approved">学院领导-通过</option>
                        <option value="archived">归档</option>
                        <option value="rejected">退回修改</option>
                    </select>
                </div>
                <div class="form-group"><label>审核意见</label><textarea name="opinion"></textarea></div>
            </div>
            <button type="submit" class="btn btn-primary">提交审核</button>
        </form>
    </div>
</div>
</body>
</html>
