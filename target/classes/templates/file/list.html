<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>文件管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "微软雅黑", sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            font-size: 24px;
        }

        .nav {
            background: white;
            padding: 0 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
        }

        .nav a {
            display: block;
            padding: 15px 20px;
            text-decoration: none;
            color: #333;
            font-size: 14px;
            border-bottom: 3px solid transparent;
        }

        .nav a:hover,
        .nav a.active {
            color: #1a73e8;
            border-bottom-color: #1a73e8;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #1a73e8;
            color: white;
        }

        .btn-success {
            background: #34a853;
            color: white;
        }

        .btn-danger {
            background: #ea4335;
            color: white;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .msg {
            padding: 10px 20px;
            background: #d4edda;
            color: #155724;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .upload-area {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .upload-area h3 {
            margin-bottom: 15px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .form-group {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #555;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>文件管理</h1>
    </div>
    <div class="nav">
        <a href="/">首页</a>
        <a href="/competition">学科竞赛</a>
        <a href="/innovation">大创项目</a>
        <a href="/software">软件著作权</a>
        <a href="/paper">学术论文</a>
        <a href="/file" class="active">文件管理</a>
        <a href="/statistics">数据统计</a>
    </div>
    <div class="container">
        <div th:if="${msg}" class="msg" th:text="${msg}"></div>

        <div class="upload-area">
            <h3>上传文件</h3>
            <form action="/file/upload" method="post" enctype="multipart/form-data">
                <div class="form-row">
                    <div class="form-group">
                        <label>选择文件</label>
                        <input type="file" name="files" multiple required>
                    </div>
                    <div class="form-group">
                        <label>分类</label>
                        <select name="category">
                            <option value="competition">学科竞赛</option>
                            <option value="innovation">大创项目</option>
                            <option value="software">软件著作权</option>
                            <option value="paper">学术论文</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">上传</button>
                </div>
            </form>
        </div>

        <div class="toolbar">
            <h2>文件列表</h2>
        </div>
        <table>
            <thead>
                <tr>
                    <th>序号</th>
                    <th>文件名</th>
                    <th>类型</th>
                    <th>大小</th>
                    <th>分类</th>
                    <th>关联类型</th>
                    <th>上传时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="f, stat : ${files}">
                    <td th:text="${stat.count}"></td>
                    <td th:text="${f.originalName}"></td>
                    <td th:text="${f.fileType}"></td>
                    <td th:text="${f.fileSize} + ' B'"></td>
                    <td th:text="${f.category}"></td>
                    <td th:text="${f.relatedType}"></td>
                    <td th:text="${f.uploadTime}"></td>
                    <td>
                        <a th:href="@{/file/preview/{id}(id=${f.id})}" target="_blank"
                            class="btn btn-primary btn-sm">预览</a>
                        <a th:href="@{/file/download/{id}(id=${f.id})}" class="btn btn-success btn-sm">下载</a>
                        <a th:href="@{/file/delete/{id}(id=${f.id})}" class="btn btn-danger btn-sm"
                            onclick="return confirm('确定删除？')">删除</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
