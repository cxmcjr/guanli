<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 科研成果管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "微软雅黑", sans-serif; background: linear-gradient(135deg, #1a73e8, #0d47a1); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; border-radius: 16px; padding: 40px; width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .login-box h2 { text-align: center; color: #1a73e8; margin-bottom: 10px; font-size: 24px; }
        .login-box .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus { outline: none; border-color: #1a73e8; }
        .btn { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #1557b0; }
        .links { text-align: center; margin-top: 20px; font-size: 13px; }
        .links a { color: #1a73e8; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .msg { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; text-align: center; }
        .msg-error { background: #fde8e8; color: #c62828; }
        .msg-success { background: #e8f5e9; color: #2e7d32; }
        .tips { background: #f0f7ff; border-radius: 8px; padding: 15px; margin-top: 20px; font-size: 12px; color: #666; line-height: 1.8; }
        .tips strong { color: #1a73e8; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>科研成果管理系统</h2>
    <p class="subtitle">请登录您的账号</p>
    <div th:if="${error}" class="msg msg-error" th:text="${error}"></div>
    <div th:if="${msg}" class="msg msg-success" th:text="${msg}"></div>
    <form action="/login" method="post">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn">登 录</button>
    </form>
    <div class="links">
        还没有账号？<a href="/register">立即注册</a>
    </div>
    <div class="tips">
        <strong>测试账号：</strong><br>
        管理员：admin / admin123<br>
        科研秘书：secretary / secretary123<br>
        学院领导：leader / leader123<br>
        学生：student / student123
    </div>
</div>
</body>
</html>
